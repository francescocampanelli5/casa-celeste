<!--
Subject: {{subjectLine}}

L'oggetto è calcolato in guest-lifecycle-emails.js in base alla lingua
della prenotazione — il campo Subject nel template EmailJS deve essere
esattamente {{subjectLine}}.

Variabili usate: email, name, roomLabel, checkIn, checkInTime, address,
checkInInstructions, wifiName, wifiPassword, streetGateLink, roomAccessCode,
hasRoomAccessCode, videoCallLink, videoCallNote, assistLink, isEn,
subjectLine, isGroup, rooms, logoUrl, assistButtonLabel, blocksHtml

blocksHtml sostituisce tutto il corpo con HTML già pronto, calcolato da
affittacamere/js/email-block-renderer.js (renderTemplateBody('t3', layout,
vars)) PRIMA di chiamare Mustache — vedi _lib.js e
1-conferma-prenotazione.html per il meccanismo completo. Layout in
tourism_settings/site.emailLayouts.t3. videoCallNote arriva già come
stringa finale pronta (varianti editabili in Impostazioni → Email ospiti →
Generali → Testo videochiamata di verifica, vedi emailVideoCallTexts in
email-texts-defaults.json e composeAndSendCheckin in
guest-lifecycle-emails.js).

roomAccessCode/hasRoomAccessCode: codice o link per aprire la singola
stanza, inserito a mano dal proprietario in dashboard per QUESTA
prenotazione (cambia sempre, non generato dal sistema). Il box
{{#hasRoomAccessCode}}...{{/hasRoomAccessCode}} appare solo se il
proprietario l'ha compilato — per un gruppo elenca solo le stanze che
hanno un codice impostato (loop {{#rooms}}{{#roomAccessCode}}...{{/roomAccessCode}}{{/rooms}}).

Nota: il bottone videochiamata è dentro {{#videoCallLink}}...{{/videoCallLink}}
(sintassi Mustache) — appare solo se la videochiamata è attiva
(Impostazioni → "Offri la videochiamata...") E il link Google Meet è
configurato, altrimenti resta solo la nota testuale {{videoCallNote}}
senza bottone rotto. Nessuno skip per "già verificato in passato": OGNI
nuova prenotazione richiede una nuova verifica al primo ingresso, quindi
questa sezione compare sempre. Stesso discorso per
{{#streetGateLink}}...{{/streetGateLink}} (facoltativo, Impostazioni →
WiFi e istruzioni check-in).

Prenotazione di più stanze insieme (isGroup=true): un'unica email parte
solo quando OGNI stanza del gruppo ha completato i documenti (vedi
sendCheckinInstructionsGroup in guest-lifecycle-emails.js) — indirizzo,
WiFi, istruzioni di accesso e portone sono condivisi per l'intera
struttura, roomLabel diventa l'elenco di tutte le stanze del gruppo
("Le tue stanze: Maestrale e Scirocco"). La videochiamata di
verifica documento, se attiva, è UNICA per l'intero gruppo (non una a
stanza).

Ricorda: To Email = {{email}} nelle impostazioni del template (vedi README).
-->
<style>
  @media only screen and (max-width:480px) {
    .cc-outer { padding:20px 10px !important; }
    .cc-body { padding:24px 20px !important; }
  }
</style>
<div class="cc-outer" style="background:#F5FAFD; padding:32px 16px; font-family:Helvetica,Arial,sans-serif; -webkit-text-size-adjust:100%; text-size-adjust:100%; color-scheme:light;">
  <table role="presentation" width="100%" style="max-width:560px; margin:0 auto; background:#FFFFFF; border-radius:16px; overflow:hidden; border:1px solid rgba(16,35,59,0.08);" cellpadding="0" cellspacing="0">
    <tr>
      <td style="background:#2C8FC9; height:4px; line-height:4px; font-size:0;">&nbsp;</td>
    </tr>
    <tr>
      <td style="background:#10233B; padding:26px 32px;">
        {{#logoUrl}}
        <img src="{{logoUrl}}" alt="{{siteName}}" height="24" style="height:24px; max-height:24px; width:auto; max-width:180px; display:inline-block; vertical-align:middle; border:0;">
        {{/logoUrl}}
        {{^logoUrl}}
        <span style="display:inline-block; width:12px; height:12px; border-radius:50%; background:#2C8FC9; margin-right:2px;"></span><span style="display:inline-block; width:12px; height:12px; border-radius:50%; background:#FFD24C; margin-right:8px;"></span>
        <span style="color:#FFFFFF; font-size:18px; font-weight:700; letter-spacing:0.01em; vertical-align:middle;">{{siteName}}</span>
        {{/logoUrl}}
      </td>
    </tr>
    <tr>
      <td class="cc-body" style="padding:32px;">
        {{{blocksHtml}}}
      </td>
    </tr>
    <tr>
      <td style="background:#F5FAFD; padding:20px 32px; text-align:center;">
        <p style="font-size:12px; color:#6B7A8C; margin:0;">{{siteName}} — {{address}}</p>
        {{#footerSignature}}<p style="font-size:12px; color:#6B7A8C; margin:8px 0 0;">{{footerSignature}}</p>{{/footerSignature}}
      </td>
    </tr>
  </table>
</div>
