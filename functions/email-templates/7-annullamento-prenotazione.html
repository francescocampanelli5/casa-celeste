<!--
Subject: {{subjectLine}}

L'oggetto è calcolato in functions/guest-notify.js (funzione subjectFor)
in base alla lingua della prenotazione — il Subject reale (già tradotto)
arriva come variabile, non va scritto qui fisso.

Inviata IMMEDIATAMENTE quando una prenotazione passa a status=annullato
(trigger Firestore onBookingStatusChange in functions/index.js), sia per
cancellazione self-service dell'ospite (con rimborso Stripe automatico)
sia per annullamento manuale del proprietario in dashboard — non passa
dal cron orario.

Variabili usate: email, name, roomLabel, checkIn, checkOut, hasRefund,
refundAmount, assistLink, isEn, subjectLine, isGroup, logoUrl,
assistButtonLabel, blocksHtml

blocksHtml sostituisce tutto il corpo con HTML già pronto, calcolato da
functions/email-block-renderer.js (renderTemplateBody('t7', layout, vars),
stesso meccanismo duplicato lì per lo stesso motivo di emailTextVars,
pacchetto Node separato) PRIMA di chiamare Mustache — vedi
functions/guest-notify.js e 1-conferma-prenotazione.html per il
meccanismo completo. Layout in tourism_settings/site.emailLayouts.t7,
editabile da dashboard (Impostazioni → Email ospiti → 7. Annullamento →
Impaginazione).

hasRefund/refundAmount: presenti solo se la cancellazione è passata da
cancelBookingCore (self-service online, con rimborso Stripe automatico
del solo costo soggiorno, mai della commissione di pagamento). Per un
annullamento manuale dal proprietario senza rimborso automatico, questa
sezione semplicemente non appare — il testo generico va comunque bene.

Prenotazione di più stanze insieme (isGroup=true): roomLabel diventa
l'elenco di tutte le stanze del gruppo (l'intero gruppo si annulla e si
rimborsa come blocco unico, mai una stanza sola).

Ricorda: la funzione invia direttamente a {{email}}, non serve nessuna
impostazione "To Email" (non è più EmailJS).
-->
<style>
  @media only screen and (max-width:480px) {
    .cc-outer { padding:20px 10px !important; }
    .cc-body { padding:24px 20px !important; }
  }
</style>
<div class="cc-outer" style="background:#F5FAFD; padding:32px 16px; font-family:Helvetica,Arial,sans-serif; -webkit-text-size-adjust:100%; text-size-adjust:100%; color-scheme:light;">
  <table role="presentation" width="100%" style="max-width:560px; margin:0 auto; background:#FFFFFF; border-radius:16px; overflow:hidden; border:1px solid rgba(16,35,59,0.08);" cellpadding="0" cellspacing="0">
    <tr>
      <td style="background:#8A98A8; height:4px; line-height:4px; font-size:0;">&nbsp;</td>
    </tr>
    <tr>
      <td style="background:#10233B; padding:26px 32px;">
        {{#logoUrl}}
        <img src="{{logoUrl}}" alt="{{siteName}}" height="24" style="height:24px; max-height:24px; width:auto; max-width:180px; display:inline-block; vertical-align:middle; border:0;">
        {{/logoUrl}}
        {{^logoUrl}}
        <span style="display:inline-block; width:12px; height:12px; border-radius:50%; background:#2C8FC9; margin-right:2px;"></span><span style="display:inline-block; width:12px; height:12px; border-radius:50%; background:#FFD24C; margin-right:8px;"></span>
        <span style="color:#FFFFFF; font-size:18px; font-weight:700; letter-spacing:0.01em; vertical-align:middle;">{{siteName}}</span>
        {{/logoUrl}}
      </td>
    </tr>
    <tr>
      <td class="cc-body" style="padding:32px;">
        {{{blocksHtml}}}
      </td>
    </tr>
    <tr>
      <td style="background:#F5FAFD; padding:20px 32px; text-align:center;">
        <p style="font-size:12px; color:#6B7A8C; margin:0;">{{siteName}} — {{address}}</p>
        {{#footerSignature}}<p style="font-size:12px; color:#6B7A8C; margin:8px 0 0;">{{footerSignature}}</p>{{/footerSignature}}
      </td>
    </tr>
  </table>
</div>
