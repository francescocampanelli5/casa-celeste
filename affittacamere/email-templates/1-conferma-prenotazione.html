<!--
Subject: {{subjectLine}}

L'oggetto è calcolato in affittacamere/scripts/guest-lifecycle-emails.js
(funzione subjectFor) in base alla lingua della prenotazione (b.lang) e
passato come variabile semplice — non lasciare qui un testo fisso, il
campo Subject nel template EmailJS deve essere esattamente {{subjectLine}}.

Variabili usate: email, name, roomLabel, checkIn, checkOut, nights, guests,
totalDue, docsLink, checkInTime, checkOutTime, googleCalendarLink, icsLink,
assistLink, isEn, subjectLine, isGroup, rooms, logoUrl, assistButtonLabel,
blocksHtml

blocksHtml sostituisce tutto il corpo (dal titolo alla nota spam incluso)
con HTML già pronto, calcolato da affittacamere/js/email-block-renderer.js
(renderTemplateBody('t1', layout, vars)) PRIMA di chiamare Mustache — vedi
_lib.js. Il layout (ordine dei blocchi essenziali + eventuali blocchi
liberi aggiunti da dashboard → Email ospiti → Impaginazione) vive in
tourism_settings/site.emailLayouts.t1, con fallback al layout di default
(stesso ordine che c'era qui prima, invariato) se non ancora personalizzato.
Non riscrivere qui markup fisso per il corpo: andrebbe perso, l'unica fonte
ora è email-block-renderer.js (stessa funzione usata anche per l'anteprima
live in dashboard — garantisce WYSIWYG). I singoli testi (t1_h1, ecc.)
restano modificabili da dashboard esattamente come prima, sono renderizzati
dentro le funzioni ESSENTIAL_RENDERERS.t1 del renderer.

googleCalendarLink e icsLink permettono all'ospite di salvare le date sul
proprio calendario: il primo apre Google Calendar precompilato (nessun
download), il secondo scarica un file .ics standard che apre Apple
Calendar, Outlook o qualunque altra app di calendario. Entrambi calcolati
in guest-lifecycle-emails.js (funzioni googleCalendarLink/icsLink) — il
secondo passa dalla Cloud Function bookingCalendarIcs (functions/index.js),
protetta dallo stesso token del link documenti.

Prenotazione di più stanze insieme (isGroup=true): checkIn/checkOut/nights/
guests/totalDue sono già aggregati sull'intero gruppo dallo script,
roomLabel diventa l'elenco di tutte le stanze ("Maestrale e
Scirocco"). rooms (lista di {roomLabel, docsLink} — loop Mustache
{{#rooms}}...{{/rooms}}) sostituisce l'unico bottone documenti con un
bottone per stanza, perché ogni stanza ha ospiti e documenti propri.

logoUrl: se caricato in Impostazioni → Email ospiti → Generali, sostituisce
i due pallini colorati + nome sito. L'attributo HTML height (non solo il
CSS) è necessario per Outlook desktop, che ignora max-height via CSS sugli
<img> — senza, la barra dell'header potrebbe allargarsi.

Ricorda: To Email = {{email}} nelle impostazioni del template (vedi README).
-->
<style>
  @media only screen and (max-width:480px) {
    .cc-outer { padding:20px 10px !important; }
    .cc-body { padding:24px 20px !important; }
  }
</style>
<div class="cc-outer" style="background:#F5FAFD; padding:32px 16px; font-family:Helvetica,Arial,sans-serif; -webkit-text-size-adjust:100%; text-size-adjust:100%; color-scheme:light;">
  <table role="presentation" width="100%" style="max-width:560px; margin:0 auto; background:#FFFFFF; border-radius:16px; overflow:hidden; border:1px solid rgba(16,35,59,0.08);" cellpadding="0" cellspacing="0">
    <tr>
      <td style="background:#2C8FC9; height:4px; line-height:4px; font-size:0;">&nbsp;</td>
    </tr>
    <tr>
      <td style="background:#10233B; padding:26px 32px;">
        {{#logoUrl}}
        <img src="{{logoUrl}}" alt="{{siteName}}" height="24" style="height:24px; max-height:24px; width:auto; max-width:180px; display:inline-block; vertical-align:middle; border:0;">
        {{/logoUrl}}
        {{^logoUrl}}
        <span style="display:inline-block; width:12px; height:12px; border-radius:50%; background:#2C8FC9; margin-right:2px;"></span><span style="display:inline-block; width:12px; height:12px; border-radius:50%; background:#FFD24C; margin-right:8px;"></span>
        <span style="color:#FFFFFF; font-size:18px; font-weight:700; letter-spacing:0.01em; vertical-align:middle;">{{siteName}}</span>
        {{/logoUrl}}
      </td>
    </tr>
    <tr>
      <td class="cc-body" style="padding:32px;">
        {{{blocksHtml}}}
      </td>
    </tr>
    <tr>
      <td style="background:#F5FAFD; padding:20px 32px; text-align:center;">
        <p style="font-size:12px; color:#6B7A8C; margin:0;">{{siteName}} — {{address}}</p>
        {{#footerSignature}}<p style="font-size:12px; color:#6B7A8C; margin:8px 0 0;">{{footerSignature}}</p>{{/footerSignature}}
      </td>
    </tr>
  </table>
</div>
